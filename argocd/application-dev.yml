apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-red-line-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: development
spec:
  project: devops-red-line
  source:
    repoURL: https://github.com/kalah26/devops_red_line.git  # Update with your actual repo URL
    targetRevision: develop  # or main/master
    path: manifests/overlays/development
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
  revisionHistoryLimit: 3
