apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: devops-red-line
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: DevOps Red Line Application Project
  
  # Source repositories
  sourceRepos:
    - 'https://github.com/kalah26/devops_red_line.git'  # Update with your actual repo URL
  
  # Destination clusters and namespaces
  destinations:
    - namespace: default
      server: https://kubernetes.default.svc
    - namespace: devops-red-line  # Optional: if you want to deploy to a specific namespace
      server: https://kubernetes.default.svc
  
  # Cluster resource allow list
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'networking.k8s.io'
      kind: Ingress
  
  # Namespace resource allow list
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: PersistentVolumeClaim
    - group: 'apps'
      kind: Deployment
    - group: 'networking.k8s.io'
      kind: Ingress
  
  # Roles for fine-grained access control
  roles:
    - name: admin
      description: Admin access to the project
      policies:
        - p, proj:devops-red-line:admin, applications, *, devops-red-line/*, allow
        - p, proj:devops-red-line:admin, repositories, *, *, allow
      groups:
        - devops-admin
    - name: developer
      description: Developer access to the project
      policies:
        - p, proj:devops-red-line:developer, applications, get, devops-red-line/*, allow
        - p, proj:devops-red-line:developer, applications, sync, devops-red-line/*, allow
      groups:
        - devops-developer
