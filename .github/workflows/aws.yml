name: AWS (CDK)

on:
  pull_request:
    paths: ['Backend/**', 'Frontend/**', 'infra/**', '.github/workflows/aws.yml']
  push:
    branches: [main]
    paths: ['Backend/**', 'Frontend/**', 'infra/**', '.github/workflows/aws.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odc
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: odcdb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U odc" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: Backend/odc
    env:
      DB_HOST: localhost
      POSTGRES_USER: odc
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: odcdb
      DJANGO_SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Backend/odc/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py test

  infra-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Synth with cdk-nag (AwsSolutions)
        run: npx tsx bin/app.ts
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
          CDK_OUTDIR: cdk.out

  deploy:
    # Runs only on main, and only once the OIDC role ARN is configured as a repo variable.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: [backend-tests, infra-checks]
    runs-on: ubuntu-latest
    environment: aws
    concurrency: aws-deploy
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS, no stored keys
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: cdk diff
        run: npx cdk diff RedLine-Network RedLine-Data RedLine-App ${{ env.CONTEXT }}
        env:
          CONTEXT: -c alertEmail=${{ vars.ALERT_EMAIL }} -c certificateArn=${{ vars.CERTIFICATE_ARN }}
      - name: cdk deploy (builds and pushes images to ECR)
        run: npx cdk deploy RedLine-Network RedLine-Data RedLine-App --require-approval never ${{ env.CONTEXT }}
        env:
          CONTEXT: -c alertEmail=${{ vars.ALERT_EMAIL }} -c certificateArn=${{ vars.CERTIFICATE_ARN }}
