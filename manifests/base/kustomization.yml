apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Secrets and ConfigMaps
  - configmaps.yml
  - django-secret.yml
  
  # Database resources
  - database/postgres-secret.yml
  - database/postgres-pvc.yml
  - database/deployment.yml
  
  # Backend resources
  - backend/deployment.yml
  
  # Frontend resources
  - frontend/deployment.yml
  
  # Ingress
  - ingress.yml

# Common labels for all resources
commonLabels:
  app.kubernetes.io/name: devops-red-line
  app.kubernetes.io/part-of: devops-red-line
  app.kubernetes.io/managed-by: argocd

# Add annotations to all resources
commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"

# You can add patches here if needed
patches: []

# Images (useful for updating image tags)
images: []

# Configure generators for secrets if needed
# secretGenerator: []

# Configure generators for config maps if needed
# configMapGenerator: []
