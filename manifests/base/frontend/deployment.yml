apiVersion: v1
kind: Service
metadata:
  name: front-service
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  selector:
    app: front-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-app
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front-app
  template:
    metadata:
      labels:
        app: front-app
    spec:
      containers:
      - name: frontend-container
        image: genecodo/frontend_red_line:v2
        ports:
        - containerPort: 80
        imagePullPolicy: Always
        env:
        # Frontend configuration from ConfigMap
        - name: REACT_APP_API_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: REACT_APP_API_URL
        - name: REACT_APP_ENV
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: REACT_APP_ENV
        - name: REACT_APP_DEBUG
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: REACT_APP_DEBUG
        resources:
          requests:
            memory: "128Mi"
            cpu: "150m"
          limits:
            memory: "256Mi"
            cpu: "500m"
