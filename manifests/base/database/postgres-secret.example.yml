# Example only. Real secrets are NOT stored in git.
# Create the real secret with ./create-secrets.sh (or use Sealed Secrets / External Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: "<db-user>"
  POSTGRES_PASSWORD: "<db-password>"
  POSTGRES_DB: "<db-name>"
