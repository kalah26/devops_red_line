apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../../base

commonLabels:
  environment: development
  
commonAnnotations:
  environment: development

patchesStrategicMerge:
  - replica-count.yml
  - config-patch.yml

images:
  - name: genecodo/frontend_red_line
    newTag: dev
  - name: genecodo/backend_red_line  
    newTag: dev
